# Runs the tests and the linter on every push and pull request, so a change
# that breaks something already working is caught before it lands.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, because new advisories are published even when the code doesn't change
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    name: Security audit (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails on any dependency with a known vulnerability (RustSec database).
      # "Unmaintained" notices are shown but don't fail the build.
      - name: Check dependencies for known vulnerabilities
        run: cargo audit


  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is where the tool is used; Linux catches platform assumptions
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting (run `cargo fmt` to fix)
        run: cargo fmt --check

      - name: Lint (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      # Includes tests/architecture.rs: core never imports ui/app or prints,
      # and no source file grows past 500 lines.
      - name: Unit, property, end-to-end and architecture tests
        run: cargo test
