# Runs the tests and the linter on every push and pull request, so a change
# that breaks something already working is caught before it lands.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is where the tool is used; Linux catches platform assumptions
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting (run `cargo fmt` to fix)
        run: cargo fmt --check

      - name: Lint (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      # Includes tests/architecture.rs: core never imports ui/app or prints,
      # and no source file grows past 500 lines.
      - name: Unit, property, end-to-end and architecture tests
        run: cargo test
